[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reports", "releases", "research", "evidence", "历史归档", "dashboard/backups", "_vol_analysis.py", "_wear_analysis.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B012", "B019", "B023", "B904"]

[tool.coverage.run]
branch = true
source = ["entropy_bot", "dashboard", "dashboard_http", "dashboard_recovery", "dashboard_snapshot", "dashboard_monitor", "dashboard_setup", "dashboard_budget", "dashboard_charts", "main", "recover_stopped_fills", "recover_stopped_orders"]
omit = ["tests/*", "reports/*", "releases/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
fail_under = 75

[tool.coverage.json]
output = "coverage.json"

[tool.mypy]
python_version = "3.11"
files = ["entropy_bot/models.py", "entropy_bot/fees.py", "entropy_bot/pacing.py", "entropy_bot/sizing.py", "entropy_bot/signing_lock.py", "entropy_bot/recovery.py", "entropy_bot/credential_store.py", "entropy_bot/config.py", "entropy_bot/config_schema.py", "entropy_bot/config_sections.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["hyperliquid.*", "eth_account.*", "dotenv.*", "websocket.*", "requests.*"]
ignore_missing_imports = true
