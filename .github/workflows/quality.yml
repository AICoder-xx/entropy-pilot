name: Offline engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_quality.py
      - name: Build independent public source package
        run: python build_public_release.py --include-dev --output releases/ci-source
      - name: Test the exact packaged files without private local data
        working-directory: releases/ci-source
        run: python -m pytest -q tests -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/quality/
            releases/ci-source-manifest.json
          include-hidden-files: true
